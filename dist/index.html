rbon Pricing Dashboard; IEA",bias:"long",drift:{electricity:.015,water:.008},regions:["europe","oceania","americas"]},{id:"storage",name:"Storage Levels & Inventories",category:"Market",commodities:["oil","water"],explanation:"High crude inventories and full strategic reserves cushion price spikes, while ample reservoir levels keep water tariffs stable. Low storage has the opposite effect across both markets.",direction:"down",magnitude:"Medium",source:"EIA Weekly Petroleum Status; IEA",bias:"short",drift:{oil:-.01,water:-.006},regions:["americas","europe","global"]},{id:"ev-adoption",name:"EV Adoption & Energy Transition",category:"Transition",commodities:["oil"],explanation:"Electric vehicles already displace several million barrels per day of oil demand, and that figure is expected to triple by 2030 — structurally capping oil demand growth over the decade.",direction:"down",magnitude:"High",source:"IEA Global EV Outlook",bias:"long",drift:{oil:-.02},regions:["europe","americas","asia","oceania"]},{id:"infrastructure",name:"Grid & Water Infrastructure Investment",category:"Investment",commodities:["electricity","water"],explanation:"Aging grids need trillions in transmission and resilience spending, while leaky water networks lose 20–30% of supply — costs that regulators ultimately allow to flow into tariffs.",direction:"up",magnitude:"Medium",source:"IEA; World Bank",bias:"long",drift:{electricity:.012,water:.012},regions:["africa","americas","asia","europe"]}],iv={asia:[{id:"asia-1",name:"China & India Energy Demand Growth",category:"Demand",commodities:["oil","electricity"],explanation:"Asia's two largest economies drive the majority of global energy demand growth. Rising industrial output, urbanization, and vehicle ownership in China and India support both crude oil and power prices across the region.",direction:"up",magnitude:"High",source:"IEA World Energy Outlook; China NBS; India PPAC",bias:"long",drift:{oil:.02,electricity:.014},regions:["asia","global"],scope:"asia",importanceScore:78,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},{id:"asia-2",name:"ASEAN Grid Interconnection",category:"Infrastructure",commodities:["electricity"],explanation:"The ASEAN Power Grid initiative is progressively interconnecting Southeast Asian transmission networks, enabling cross-border power trade, reducing reserve margins, and moderating wholesale price spikes in import-dependent markets.",direction:"down",magnitude:"Medium",source:"ASEAN Centre for Energy; ADB",bias:"mid",drift:{electricity:-.015},regions:["asia"],scope:"asia",importanceScore:62,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},{id:"asia-3",name:"Coal-to-Gas Switching",category:"Transition",commodities:["oil","electricity"],explanation:"Several Asian economies are accelerating coal-to-gas conversion in power generation to meet emissions targets. This structural shift supports regional LNG demand and reduces the carbon intensity of electricity, while adding a gas-price link to power costs.",direction:"mixed",magnitude:"High",source:"IGU World LNG Report; IEA Gas 2025",bias:"mid",drift:{oil:.008,electricity:.01},regions:["asia"],scope:"asia",importanceScore:70,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},{id:"asia-4",name:"Strait of Hormuz Risk",category:"Geopolitics",commodities:["oil"],explanation:"Over 20% of global oil supply transits the Strait of Hormuz. Any disruption — whether from regional conflict, sanctions enforcement, or shipping incidents — immediately lifts Asian crude import costs and adds a persistent risk premium to Dubai/Oman benchmarks.",direction:"up",magnitude:"High",source:"EIA; Vortexa; UNCTAD",bias:"short",drift:{oil:.025},regions:["asia","global"],scope:"asia",importanceScore:82,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},{id:"asia-5",name:"Urbanization & Desalination",category:"Structural",commodities:["water","electricity"],explanation:"Rapid u
